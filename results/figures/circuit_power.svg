<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440">
  <!-- Inverting buck-boost power stage, paper parameters (clean layout) -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#222"/>
    </marker>
  </defs>

  <!-- ================= input source ================= -->
  <circle cx="90" cy="130" r="34" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <text x="90" y="42" font-family="Times New Roman, serif" font-size="20" text-anchor="middle" fill="#222" font-style="italic">V<tspan dy="5" font-size="14" baseline-shift="super">in</tspan></text>
  <text x="90" y="64" font-family="Times New Roman, serif" font-size="15" text-anchor="middle" fill="#222">+12 V</text>
  <text x="72" y="130" font-family="Times New Roman, serif" font-size="17" fill="#222" text-anchor="middle">+</text>
  <text x="108" y="148" font-family="Times New Roman, serif" font-size="17" fill="#222" text-anchor="middle">−</text>
  <line x1="90" y1="96" x2="90" y2="78" stroke="#222" stroke-width="2.5"/>
  <line x1="90" y1="78" x2="200" y2="78" stroke="#222" stroke-width="2.5"/>
  <line x1="90" y1="164" x2="90" y2="392" stroke="#222" stroke-width="2.5"/>
  <line x1="40" y1="392" x2="140" y2="392" stroke="#222" stroke-width="2.5"/>

  <!-- ================= switch Q ================= -->
  <line x1="200" y1="78" x2="200" y2="88" stroke="#222" stroke-width="2.5"/>
  <line x1="188" y1="128" x2="212" y2="128" stroke="#222" stroke-width="3"/>
  <line x1="188" y1="128" x2="212" y2="98" stroke="#222" stroke-width="3"/>
  <line x1="188" y1="128" x2="201" y2="102" stroke="#222" stroke-width="3"/>
  <line x1="200" y1="128" x2="200" y2="150" stroke="#222" stroke-width="2.5"/>
  <text x="252" y="112" font-family="Times New Roman, serif" font-size="19" fill="#222" font-style="italic">Q</text>
  <text x="252" y="134" font-family="Times New Roman, serif" font-size="15" fill="#666">f<tspan dy="5" font-size="11" baseline-shift="sub">sw</tspan> = 100 kHz</text>

  <line x1="200" y1="150" x2="200" y2="196" stroke="#222" stroke-width="2.5"/>
  <circle cx="200" cy="196" r="4.5" fill="#222"/>
  <line x1="200" y1="196" x2="330" y2="196" stroke="#222" stroke-width="2.5"/>

  <!-- ================= diode to ground ================= -->
  <line x1="200" y1="196" x2="200" y2="258" stroke="#222" stroke-width="2.5"/>
  <polygon points="188,258 212,278 188,298" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <line x1="212" y1="258" x2="212" y2="298" stroke="#222" stroke-width="3"/>
  <line x1="212" y1="278" x2="222" y2="278" stroke="#222" stroke-width="2.5"/>
  <line x1="222" y1="273" x2="222" y2="392" stroke="#222" stroke-width="2.5"/>
  <text x="148" y="285" font-family="Times New Roman, serif" font-size="18" fill="#222" font-style="italic">D</text>
  <line x1="196" y1="392" x2="248" y2="392" stroke="#222" stroke-width="2.5"/>
  <line x1="204" y1="398" x2="240" y2="398" stroke="#222" stroke-width="2"/>
  <line x1="212" y1="404" x2="232" y2="404" stroke="#222" stroke-width="1.5"/>
  <line x1="220" y1="410" x2="224" y2="410" stroke="#222" stroke-width="1"/>

  <!-- ================= inductor L ================= -->
  <line x1="330" y1="196" x2="356" y2="196" stroke="#222" stroke-width="2.5"/>
  <path d="M356,196 a12,12 0 0 1 24,0 a12,12 0 0 1 24,0 a12,12 0 0 1 24,0 a12,12 0 0 1 24,0 a12,12 0 0 1 24,0"
        fill="none" stroke="#222" stroke-width="2.5"/>
  <line x1="476" y1="196" x2="530" y2="196" stroke="#222" stroke-width="2.5"/>
  <text x="413" y="244" font-family="Times New Roman, serif" font-size="19" fill="#222" font-style="italic">L</text>
  <text x="413" y="266" font-family="Times New Roman, serif" font-size="15" fill="#666">100 µH</text>
  <line x1="530" y1="196" x2="640" y2="196" stroke="#222" stroke-width="2.5"/>
  <circle cx="640" cy="196" r="4.5" fill="#222"/>
  <line x1="640" y1="196" x2="800" y2="196" stroke="#222" stroke-width="2.5"/>
  <circle cx="800" cy="196" r="4.5" fill="#222"/>

  <!-- ================= capacitor C ================= -->
  <line x1="640" y1="196" x2="640" y2="272" stroke="#222" stroke-width="2.5"/>
  <line x1="616" y1="272" x2="664" y2="272" stroke="#222" stroke-width="3.5"/>
  <line x1="616" y1="282" x2="664" y2="282" stroke="#222" stroke-width="3.5"/>
  <line x1="640" y1="282" x2="640" y2="392" stroke="#222" stroke-width="2.5"/>
  <text x="616" y="318" font-family="Times New Roman, serif" font-size="19" fill="#222" font-style="italic">C</text>
  <text x="672" y="318" font-family="Times New Roman, serif" font-size="15" fill="#666">220 µF</text>
  <line x1="614" y1="392" x2="666" y2="392" stroke="#222" stroke-width="2.5"/>
  <line x1="622" y1="398" x2="658" y2="398" stroke="#222" stroke-width="2"/>
  <line x1="630" y1="404" x2="650" y2="404" stroke="#222" stroke-width="1.5"/>

  <!-- ================= load R ================= -->
  <line x1="800" y1="196" x2="800" y2="249" stroke="#222" stroke-width="2.5"/>
  <polyline points="800,249 776,269 824,289 776,309 824,329 776,349 800,364"
            fill="none" stroke="#222" stroke-width="2.5"/>
  <line x1="800" y1="364" x2="800" y2="392" stroke="#222" stroke-width="2.5"/>
  <text x="838" y="300" font-family="Times New Roman, serif" font-size="19" fill="#222" font-style="italic">R</text>
  <text x="838" y="324" font-family="Times New Roman, serif" font-size="15" fill="#666">10 Ω</text>
  <line x1="774" y1="392" x2="826" y2="392" stroke="#222" stroke-width="2.5"/>
  <line x1="782" y1="398" x2="818" y2="398" stroke="#222" stroke-width="2"/>
  <line x1="790" y1="404" x2="810" y2="404" stroke="#222" stroke-width="1.5"/>

  <!-- ================= output terminal ================= -->
  <circle cx="900" cy="196" r="6" fill="#fff" stroke="#222" stroke-width="2.5"/>
  <line x1="900" y1="196" x2="960" y2="196" stroke="#222" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1000" y="186" font-family="Times New Roman, serif" font-size="20" fill="#222" font-style="italic">V<tspan dy="6" font-size="14" baseline-shift="super">out</tspan></text>
  <text x="1000" y="212" font-family="Times New Roman, serif" font-size="15" fill="#222">−12 V</text>

  <!-- ================= vC annotation (over inductor, clear of labels) ================= -->
  <text x="640" y="112" font-family="Times New Roman, serif" font-size="21" text-anchor="middle" fill="#222" font-style="italic">v<tspan dy="6" font-size="15" baseline-shift="sub">C</tspan> = −|V<tspan dy="6" font-size="15" baseline-shift="sub">out</tspan>|</text>

  <!-- ================= control annotation (moved right of ground column, label above) ================= -->
  <path d="M310,430 L310,396" stroke="#1a66a3" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
  <path d="M200,78 L310,78" stroke="#1a66a3" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
  <path d="M200,78 L200,152" stroke="#1a66a3" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
  <text x="326" y="86" font-family="Times New Roman, serif" font-size="15" fill="#1a66a3" text-anchor="start">d[k]</text>
  <text x="326" y="106" font-family="Times New Roman, serif" font-size="13" fill="#1a66a3" text-anchor="start">100 kHz</text>
</svg>
